[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bus-embeddings"
version = "1.0.0"
description = "Inductive embeddings of public transport networks with heterogeneous graph neural networks."
readme = "README.md"
requires-python = "~=3.11.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alexander Horn", email = "alexander.horn@thi.de" },
    { name = "Rahul Mondal", email = "rahul.mondal@thi.de" },
    { name = "Philip-Roman Adam", email = "philip-roman.adam@thi.de" },
    { name = "Patrick Cato", email = "patrick.cato@thi.de" },
    { name = "Stefanie Schmidtner", email = "stefanie.schmidtner@thi.de" },
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.1",
    "pyarrow",
    "torch==2.7.0+cu128",
    "torch-geometric==2.7.0",
    "scikit-learn",
    "xgboost>=3.2.0",
    "holidays>=0.90",
    "geopandas",
    "shapely",
    "osmnx>=2.0",
    "routingpy>=1.3.0",
    "requests",
    "tqdm",
    "matplotlib",
]

[project.optional-dependencies]
wandb = ["wandb"]

[project.urls]
Repository = "https://github.com/urbanaithi/bus-embeddings"

[tool.setuptools.packages.find]
where = ["src"]

# PyTorch with CUDA 12.8 from the PyTorch index, everything else from PyPI
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
